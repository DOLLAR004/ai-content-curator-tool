<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loomtech | AI Content Curation Workspace</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* Dashboard Title Block */
        header { border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 24px; color: #38bdf8; }
        header p { margin: 5px 0 0 0; color: #94a3b8; font-size: 14px; }

        /* Workspace Grid Layout */
        .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .panel { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; }
        .panel h2 { margin-top: 0; font-size: 16px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Input & Form Control Fields */
        textarea { width: 100%; height: 250px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; padding: 12px; box-sizing: border-box; resize: none; font-family: inherit; }
        textarea:focus { border-color: #38bdf8; outline: none; }
        
        .control-group { margin-top: 15px; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px; font-weight: 600; }
        select { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; padding: 10px; }
        
        button { width: 100%; margin-top: 20px; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }

        /* AI Structured Output Display Blocks */
        .output-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; min-height: 100px; color: #cbd5e1; font-size: 14px; line-height: 1.6; margin-bottom: 15px; }
        .badge { display: inline-block; background: #38bdf8; color: #0f172a; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 5px; margin-top: 5px; }

        @media (max-width: 768px) { .workspace { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Loomtech AI Curation Interface</h1>
            <p>Interactive full-client processing node for prompt structure rendering and data summarization.</p>
        </header>

        <div class="workspace">
            <div class="panel">
                <h2>Raw Content Feed Input</h2>
                <textarea id="sourceText" placeholder="Paste structural documents, long articles, business briefs, or code comments here..."></textarea>
                
                <div class="control-group">
                    <label>Target Execution Directive</label>
                    <select id="directiveOpt">
                        <option value="summary">Generate Corporate Executive Abstract</option>
                        <option value="bulletPoints">Extract Key Operational Directives</option>
                        <option value="socialMedia">Transform into Technical Social Script</option>
                    </select>
                </div>
                
                <button id="processBtn">Execute UI Analysis</button>
            </div>

            <div class="panel">
                <h2>Structured Analytical Output</h2>
                
                <label>Processed Results</label>
                <div id="outputText" class="output-box">Your generated structural output assets will render dynamically in this container...</div>
                
                <label>Extracted Contextual Metadata Tags</label>
                <div id="tagContainer" style="min-height: 40px;">
                    <span class="badge">Awaiting Payload Submission</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('processBtn').addEventListener('click', () => {
            const inputData = document.getElementById('sourceText').value.trim();
            const selectedDirective = document.getElementById('directiveOpt').value;
            const outputBox = document.getElementById('outputText');
            const tagBox = document.getElementById('tagContainer');

            if (!inputData) {
                alert("Please inject a text data payload into the input area first.");
                return;
            }

            // Simulate system processing lag
            outputBox.innerText = "Analyzing text matrix structure... Compiling prompt data layers...";
            tagBox.innerHTML = '<span class="badge" style="background:#475569;">Processing Engine Online</span>';

            setTimeout(() => {
                let processedOutput = "";
                let semanticTags = "";

                // Parsing rules based on selected UI directives
                if (selectedDirective === "summary") {
                    processedOutput = `[EXECUTIVE SUMMARY]:\n${inputData.substring(0, 180)}...\n\nThis core analysis isolates the Primary Operational Parameters. Resource streams must optimize matching metrics to reduce baseline latency.`;
                    semanticTags = '<span class="badge">#Abstract</span><span class="badge">#BI-Core</span><span class="badge">#Overview</span>';
                } else if (selectedDirective === "bulletPoints") {
                    processedOutput = `[KEY OPERATIONAL DIRECTIVES]:\n• Directive 01: Isolate primary transactional arrays to preserve structural security alignment.\n• Directive 02: Scale core framework distribution to support secondary endpoint nodes.\n• Directive 03: Establish systemic validation parameters across all structural layouts.`;
                    semanticTags = '<span class="badge">#Directives</span><span class="badge">#ActionItems</span><span class="badge">#Architecture</span>';
                } else {
                    processedOutput = `🚀 TECHNICAL BRIEF:\n\nLooking into structural optimization channels! This data layout reveals incredible insights regarding baseline resource patterns. \n\nCheck out the architecture framework adjustments below. #TechInnovation #LoomtechSolutions #WebDevelopment`;
                    semanticTags = '<span class="badge">#SocialDistribution</span><span class="badge">#MediaSprints</span><span class="badge">#Engagement</span>';
                }

                // Injecting processed strings into the UI layout
                outputBox.innerText = processedOutput;
                tagBox.innerHTML = semanticTags;

            }, 800); // 800ms UI update trigger
        });
    </script>
</body>
</html>
